name = "dodie-kendal-new-site"
# worker-entry.mjs issues the canonical-URL 301s, then hands off to the Astro
# app via @astrojs/cloudflare/handler (see that file for why it can't be done in
# _redirects). `astro build` bundles it into dist/server/ and writes
# dist/server/wrangler.json plus .wrangler/deploy/config.json, which points
# `wrangler deploy` / `wrangler dev` at that generated config: always build first.
main = "./worker-entry.mjs"
compatibility_date = "2026-05-18"
compatibility_flags = ["nodejs_compat"]

# Non-secret runtime vars. These MUST live here, not just in the dashboard:
# every push triggers a `wrangler deploy`, which RESETS dashboard-set plain-text
# vars (but preserves Secrets). GHL_LOCATION_ID is a non-secret subaccount id
# (Dodie's dodiekendall subaccount), so it belongs here. The matching
# GHL_PRIVATE_INTEGRATION_TOKEN is a Secret — keep it in the dashboard / `wrangler
# secret put`, never here.
[vars]
GHL_LOCATION_ID = "6pOamCMOsrYqjbufLI5y"
GHL_CALENDAR_ID = "BMH5KWMN8ncgnlLupep5"
# Free 30-min discovery call, offered first on /book (2026-10-03).
GHL_DISCOVERY_CALENDAR_ID = "aeFKFAVilVygKrvPuocJ"
# "QHHT Long-Term Nurture" (monthly marketing). It enrolls EVERY new contact; new
# free-guide sign-ups are held out of it until they confirm their email (double opt-in).
GHL_WORKFLOW_LONG_TERM_NURTURE_ID = "0e2090b8-f9a1-46b4-ae4e-dee2e2eb9f8c"

# Free-guide abuse limits (src/lib/guide-limits.ts): one guide email per address
# per day, and a per-IP sign-up cap. D1 (SQLite) so each claim is one atomic
# statement. Schema: migrations/ — apply with
#   npx wrangler d1 migrations apply dodie-lead-limits --remote
[[d1_databases]]
binding = "LEAD_DB"
database_name = "dodie-lead-limits"
database_id = "70ae85b6-dd3e-472c-9d48-f9e1db0aa489"

# Static assets. The build sets the directory (dist/client) in the generated
# config. The Worker (above) handles SSR routes that have
# `export const prerender = false`: /book, /404 and /api/*.
#
# `run_worker_first = true` means the Worker is the entry for every request.
# The Astro handler inspects the request path: it serves prerendered HTML via
# env.ASSETS.fetch() for static routes, and runs SSR for the dynamic ones.
[assets]
binding = "ASSETS"
run_worker_first = true

# Observability is enabled in the CF dashboard separately — no toml flag needed.
